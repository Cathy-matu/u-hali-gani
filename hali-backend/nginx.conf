# Nginx Configuration for Hali Backend Reverse Proxy
events {
    worker_connections 1024;
}

http {
    upstream hali_backend {
        server backend:5000;
    }

    # Rate limiting zone (10 requests per second per IP)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    server {
        listen 80;
        server_name localhost;

        # Enforce security headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        client_max_body_size 10M;

        # API routing
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://hali_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket proxy for confidential live messaging
        location /api/messages/ws/ {
            proxy_pass http://hali_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400;
        }

        # Health check endpoint
        location /health {
            proxy_pass http://hali_backend;
        }

        # Interactive Documentation
        location /docs {
            proxy_pass http://hali_backend;
        }

        location /redoc {
            proxy_pass http://hali_backend;
        }
    }
}

